name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install development dependencies
        id: install
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check backend/app import-obsidian.py
      - name: Check Python formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m ruff format --check backend/app import-obsidian.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install dependencies from lockfile
        id: install
        run: npm --prefix frontend ci
      - name: ESLint
        run: npm --prefix frontend run lint
      - name: Check formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run format:check
      - name: Build Vite
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm --prefix frontend run build
